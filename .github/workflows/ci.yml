name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Larastan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, bcmath, intl
          coverage: pcov

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Build assets
        run: npm run build --if-present

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # shell: bash turns on pipefail, so a coverage failure is not hidden by tee
      - name: Tests with coverage
        shell: bash
        run: php artisan test --coverage --min=90 | tee coverage.txt

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.1
        with:
          scan-args: |-
            --lockfile=composer.lock
